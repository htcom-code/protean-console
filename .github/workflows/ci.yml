# GitHub Actions CI — the same local gate contributors run (CONTRIBUTING.md):
# lint, then build and test. Both run only after `lint` passes, and in parallel
# with each other. This is a client-only SPA, so there is no publish step. Runs on
# every PR and push to main (no path filter) so the branch-protection required
# check always reports — otherwise a doc-only PR would never get a status and
# could not be merged.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: install
        run: npm ci
      - name: lint
        run: npm run lint

  # build proves the type-check + production bundle assemble; gated on lint.
  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: install
        run: npm ci
      - name: build
        run: npm run build

  # Scenario tests: the stream hook + trace store + a real IndexedDB driven through
  # sequences a user can perform. Gated on lint, parallel with build.
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: install
        run: npm ci
      - name: test
        run: npm test

  # Aggregate gate. Branch protection requires THIS job rather than the individual
  # jobs, so the job graph can change without editing protection — and a renamed
  # job can no longer leave a required check that never reports.
  #
  # `if: always()` makes it run even when an upstream job fails or is skipped, and
  # the step then asserts each result explicitly: `success()` alone would let a
  # skipped or cancelled upstream job pass as green.
  ci-complete:
    if: always()
    needs: [lint, build, test]
    runs-on: ubuntu-latest
    steps:
      - name: assert upstream jobs succeeded
        run: |
          echo "lint=${{ needs.lint.result }} build=${{ needs.build.result }} test=${{ needs.test.result }}"
          for r in "${{ needs.lint.result }}" "${{ needs.build.result }}" "${{ needs.test.result }}"; do
            [ "$r" = "success" ] || exit 1
          done
