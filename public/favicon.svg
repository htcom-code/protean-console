<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!--
    Protean Trace Console favicon: mirrors the in-app brand mark (BrandLockup),
    a telemetry-teal to primary-slate rounded square with a white Activity pulse.
    Colors are baked sRGB approximations of the telemetry / primary /
    primary-foreground tokens in src/index.css.
  -->
  <defs>
    <linearGradient id="proteanMark" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13a7a4"/>
      <stop offset="1" stop-color="#1e2740"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="url(#proteanMark)"/>
  <g transform="translate(11 11) scale(1.083)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>
  </g>
</svg>
